# Response headers of every answer of the app (issues/380). Included in the
# server block and again in every location that has its own add_header: nginx
# drops the server's add_header in a location that defines any of its own.
#
# The entrypoint fills ${API_ORIGIN} (scheme + host of VUE_APP_API_URL, the same
# value config.js gets) and ${CSP_SCRIPT_HASHES} (hashes of the inline scripts of
# the built index.html, computed by the Dockerfile with tools/csp-script-hashes.mjs).

# Keep the app out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;

# No framing by other sites (clickjacking). Enforced: X-Frame-Options for old
# browsers, frame-ancestors (a CSP with only this directive can't block anything
# the app itself loads).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The full policy, report-only for now: violations are only logged in the
# browser console, nothing is blocked. Switch the name to
# Content-Security-Policy once the console stays clean on every screen.
# - script-src: the app, Kendo (/vendor/kendo) and the two inline scripts of
#   index.html. 'unsafe-eval': Kendo builds its templates with new Function().
# - style-src 'unsafe-inline': Vue/Buefy/Kendo/Gantt/html2canvas set inline styles.
# - cdn.materialdesignicons.com answers with a redirect to cdn.jsdelivr.net.
# - img-src https:: logos and uploads can live on another host.
# - blob:/data:: PDFs drawn in the browser, CSV/ODS downloads, html2canvas.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' ${CSP_SCRIPT_HASHES} 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.materialdesignicons.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.materialdesignicons.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https: ${API_ORIGIN}; connect-src 'self' ${API_ORIGIN} data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
