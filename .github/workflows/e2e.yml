name: End-to-end tests (Playwright)

# Runs tools/smoke/e2e against a real backend and database: the flows that save for
# real (projects, hours and their cost, the workday log, invoices, treasury, users).
#
# Nothing here needs tenant data. The backend image is started on an EMPTY database,
# which it seeds on first boot (catalogs, settings, the current year and its invoice
# series, and the user in SEED_USER_*); the tests create everything else. So the
# report and the failure screenshots uploaded below hold no real data.
#
# It runs every night against the latest backend image (esstrapis-back:v5) and the
# front on main, so a change on either side is caught the next morning, and on
# pull requests. It does not gate the deploy in main.yml.

on:
  schedule:
    # 03:30 UTC, when nobody is deploying
    - cron: '30 3 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'manual/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'esstrapis-back tag to test against (v5, or v5-<sha>)'
        default: v5

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_NAME: projectes_v5_e2e
  DATABASE_PASSWORD: e2e
  E2E_USER: e2e@exemple.coop
  E2E_PASSWORD: E2e-ci-12345
  E2E_BASE_URL: http://localhost:8082/
  E2E_API_URL: http://localhost:1339

jobs:
  e2e:
    # The backend image is pulled with the Docker Hub secrets, which pull requests
    # from forks don't get.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/smoke/package-lock.json

      - name: Create the empty database
        run: |
          mysql -h 127.0.0.1 -uroot -p"$DATABASE_PASSWORD" \
            -e "CREATE DATABASE \`$DATABASE_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No cron, no real e-mail (SMTP port 9 discards), and throwaway secrets.
      # VeriFactu and FACe are off in a seeded database: nothing is sent anywhere.
      # Plain HTTP and no proxy: the refresh cookie can't be `secure` here, or every
      # login answers 500 (issues/040).
      - name: Start the backend
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-back:${{ inputs.backend_tag || 'v5' }}
        run: |
          docker run -d --name backend --network host \
            -e PORT=1339 \
            -e APP_KEYS="$(openssl rand -base64 16),$(openssl rand -base64 16)" \
            -e API_TOKEN_SALT="$(openssl rand -base64 16)" \
            -e ADMIN_JWT_SECRET="$(openssl rand -base64 16)" \
            -e JWT_SECRET="$(openssl rand -base64 16)" \
            -e TRANSFER_TOKEN_SALT="$(openssl rand -base64 16)" \
            -e ENCRYPTION_KEY="$(openssl rand -base64 16)" \
            -e SECRETS_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_CLIENT=mysql \
            -e DATABASE_HOST=127.0.0.1 \
            -e DATABASE_PORT=3306 \
            -e DATABASE_NAME="$DATABASE_NAME" \
            -e DATABASE_USERNAME=root \
            -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            -e DATABASE_SSL=false \
            -e CRON_ENABLED=false \
            -e REFRESH_COOKIE_SECURE=false \
            -e EMAIL_PROVIDER=nodemailer -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=9 \
            -e RESET_PASSWORD_URL="${E2E_BASE_URL}#/reset-password" \
            -e SEED_USER_EMAIL="$E2E_USER" \
            -e SEED_USER_PASSWORD="$E2E_PASSWORD" \
            -e SEED_USER_NAME=e2e \
            "$IMAGE"

      # Meanwhile: the front and the browser
      - name: Install the front
        run: npm ci

      - name: Install Playwright
        working-directory: tools/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the front
        env:
          VUE_APP_PATH: /
          VUE_APP_API_URL: ${{ env.E2E_API_URL }}
        run: |
          nohup npx vite --port 8082 --strictPort > front.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null "$E2E_BASE_URL"; do sleep 2; done'

      # The first boot creates every table and then seeds: a few minutes.
      - name: Wait for the backend
        run: |
          timeout 600 bash -c 'until curl -sf -o /dev/null "$E2E_API_URL/_health"; do
            docker inspect -f "{{.State.Running}}" backend | grep -q true || { echo "the backend stopped"; exit 1; }
            sleep 5
          done'
          docker logs backend 2>&1 | grep seedNewDatabase

      # The tests refuse to write to a backend without this contact (helpers.mjs),
      # so that they can never touch a real tenant.
      - name: Mark the database as an e2e one
        run: |
          mysql -h 127.0.0.1 -uroot -p"$DATABASE_PASSWORD" "$DATABASE_NAME" \
            -e "INSERT INTO contacts (document_id, name, created_at, updated_at) VALUES ('e2e-sentinel', 'E2E SENTINEL', NOW(), NOW())"
          # the route, pickup and delivery type orders.spec.mjs needs (users can't create them)
          mysql -h 127.0.0.1 -uroot -p"$DATABASE_PASSWORD" "$DATABASE_NAME" < tools/smoke/e2e/logistics-fixture.sql

      - name: Run the end-to-end tests
        working-directory: tools/smoke
        run: npm run e2e

      - name: Backend and front logs
        if: failure()
        run: |
          docker logs backend > backend.log 2>&1 || true
          tail -n 200 backend.log
          tail -n 50 front.log || true

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tools/smoke/report
            tools/smoke/results
            backend.log
            front.log
          retention-days: 14
          if-no-files-found: ignore
