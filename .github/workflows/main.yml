name: Build, publish and deploy the frontend (main, Vue 3)

# main is the v5 frontend on Vue 3 (Vite): it talks to the Strapi v5 backend,
# so pair it with esstrapis-back:v5. Every push to main is tested, published as
# esstrapis-front:v5-vue3-<sha> (and the floating v5-vue3), and deployed to every
# site on the VPS (deploy/docker/deploy.sh).
# Except when only files outside the image changed since the last deploy (tests,
# tools/e2e, docs…): then it is only tested. «[skip deploy]» in the commit message
# builds and publishes without deploying (see the `changes` job).
#
# The `diligencia-test` branch is tested, published as esstrapis-front:diligencia-test
# (and diligencia-test-<sha>) and deployed only to ladili_test (ladili.esstrapis.org,
# a copy of diligencia), which deploy.sh then pins to it. Pair it with the backend's
# `diligencia-test`.

on:
  push:
    branches:
      - main
      - diligencia-test
    # Server scripts, docs and the manual don't change the image: no build, no deploy.
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'manual/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-image-${{ github.ref }}
  # Only superseded PR builds are cancelled: on main a run may be deploying, and
  # cutting it off mid-rollout would leave sites on mixed builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on Vue 2 APIs creeping back in (filters, .sync, .native, $set...)
      - name: Vue 3 migration lint
        run: npm run lint:vue3

      # With coverage, so the floor in vite.config.js (test.coverage.thresholds) is enforced.
      - name: Unit tests
        run: npm run test:unit:cov

  # Decides whether this run builds and deploys (.github/scripts/deploy-decision.sh):
  # a push that only changes files outside the image (tests, tools, e2e, docs, manual, .github, *.md) is
  # tested but neither built nor deployed, and «[skip deploy]» in the commit message
  # builds and publishes the image without deploying it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      image: ${{ steps.decide.outputs.image }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and deploy?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          # paths that don't go into the image
          NO_IMAGE_RE: '^(tests/|tools/|docs/|deploy/|manual/|\.github/|.*\.md$|\.eslintrc\.vue3\.cjs$|test-config\.sh$)'
        run: .github/scripts/deploy-decision.sh

  build-and-push:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/diligencia-test' && 'diligencia-test' || 'v5-vue3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only build: they never get the credentials or push.
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VUE_APP_PATH=/
          # The sha-pinned tag is what sites are deployed to (and rolled back to);
          # `v5-vue3` follows the latest main build.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-front:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-front:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the image just built to every site on the VPS (deploy/docker/deploy.sh:
  # canary first, then one by one, automatic rollback). The SSH key can only run that
  # script (forced command in authorized_keys), and the host key is pinned.
  # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
  deploy:
    needs: [build-and-push, changes]
    if: needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/diligencia-test')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    env:
      # diligencia-test goes only to ladili_test (a copy of diligencia), which it pins:
      # deploys of main to every site then skip it.
      DEPLOY_ARGS: ${{ github.ref == 'refs/heads/diligencia-test' && format('diligencia-test-{0} ladili_test', github.sha) || format('v5-vue3-{0}', github.sha) }}
    steps:
      - name: Deploy ${{ env.DEPLOY_ARGS }} to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          # Fingerprints only (safe to log), shown as annotations so a wrong secret is obvious.
          echo "::notice title=deploy key::$(ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - || echo 'NOT A VALID PRIVATE KEY')"
          echo "::notice title=known hosts::$(ssh-keygen -lf ~/.ssh/known_hosts | tr '\n' ' ' || echo 'NO VALID HOST KEY')"
          echo "::notice title=target::${VPS_USER:-<empty VPS_USER>}@${VPS_HOST:-<empty VPS_HOST>}"
          set +e
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "$DEPLOY_ARGS" 2> >(tee ssh-stderr.log >&2)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=deploy failed (exit $rc)::$(tail -3 ssh-stderr.log | tr '\n' ' ')"
            exit $rc
          fi
