name: Build and Publish Frontend Docker image (v5, Vue 3)

# The Vue 3 migration of the v5 frontend (branch vue-3). Same Strapi v5 API as
# the v5 image, so pair it with esstrapis-back:v5. It ships under its own
# v5-vue3 tags so a staging tenant can run it while every other tenant stays on
# esstrapis-front:v5; this workflow never touches the v5 tag. Once vue-3 is
# merged into v5, the v5 workflow builds it and this file can go.

on:
  push:
    branches:
      - vue-3
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fails on Vue 2 APIs creeping back in (filters, .sync, .native, $set...)
      - name: Vue 3 migration lint
        run: |
          npm ci
          npm run lint:vue3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VUE_APP_PATH=/stats/
          # `v5-vue3` is what the staging tenant follows; the sha-pinned tag is
          # what you roll it back (or forward) to.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-front:v5-vue3
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-front:v5-vue3-${{ github.sha }}
