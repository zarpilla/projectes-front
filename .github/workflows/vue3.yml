name: Build a preview Frontend Docker image (vue-3 branch)

# vue-3 was merged into master, which builds and deploys every site (master.yml).
# Pushes to vue-3 now only publish a preview image, esstrapis-front:v5-vue3-<sha>,
# never the floating v5-vue3 tag; try it on one site with
#   /var/www/esstrapis-front/deploy.sh v5-vue3-<sha> ladili_test

on:
  push:
    branches:
      - vue-3
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fails on Vue 2 APIs creeping back in (filters, .sync, .native, $set...)
      - name: Vue 3 migration lint
        run: |
          npm ci
          npm run lint:vue3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VUE_APP_PATH=/stats/
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-front:v5-vue3-${{ github.sha }}
